name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Bind this checkout to the advertised PR merge result
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Antigravity session hooks and declaration
        run: python3 .github/test-session-start.py
      - name: Hard-edge negative probes, rebase proof and merge guard
        run: python3 .github/test-hard-edges.py
      - name: Fixed dispatcher validation, lifetime, continuation, and cleanup
        run: python3 .github/test-dispatch.py
      - name: Current review packets, publication, and round accounting
        run: python3 .github/test-review-packet.py
      - name: Every ADR amendment block is announced by its status line
        run: python3 .github/check-adr-index.py
      - name: Canonical documentation and executor contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          reference = Path('reference')
          contracts = {
              'in-repo-writes.md': ['README.md', 'AGENTS.md', 'GEMINI.md', 'docs/PRD.md',
                                   'docs/architecture.md', 'docs/adr/NNNN-*.md',
                                   'docs/specs/YYYY-MM-DD-*.md', 'docs/architecture/<subsystem>.md'],
              'prd.md': ['docs/PRD.md'],
              'architecture.md': ['docs/architecture.md', 'docs/architecture/<subsystem>.md'],
              'adr.md': ['docs/adr/NNNN-kebab-title.md'],
              'design-spec.md': ['docs/specs/YYYY-MM-DD-<kebab-title>.md'],
              'repo-agents-md.md': ['AGENTS.md', 'GEMINI.md'],
          }
          for page, paths in contracts.items():
              text = (reference / page).read_text()
              for path in paths:
                  assert f'`{path}`' in text, f'{page}: missing canonical path {path}'
          assert not (reference / 'out-of-repo-writes.md').exists(), 'retired out-of-repo-writes page'

          for role_page, cap in (('orchestrator.md', 240), ('worker.md', 170), ('reviewer.md', 150)):
              lines = (reference / role_page).read_text().splitlines()
              assert 40 <= len(lines) <= cap, f'{role_page}: expected <= {cap} lines, got {len(lines)}'

          reviewer = (reference / 'reviewer.md').read_text()
          assert not reviewer.lstrip().startswith('```'), 'reviewer.md must not be wrapped in an outer fence'
          assert reviewer.count('{CI_CONFIGURATION_PATHS}') == 1, 'reviewer.md CI_CONFIGURATION_PATHS count'
          for heading in ('### Verdict', '### Blocking', '### Notes'):
              assert heading in reviewer, f'reviewer.md missing {heading}'

          orchestrator = (reference / 'orchestrator.md').read_text()
          roles = re.findall(r'^\| (worker|reviewer) \| `([^`]+)` at `([^`]+)` \| `([^`]+)` \|$',
                             orchestrator, re.M)
          assert roles == [('worker', 'gpt-6.1-sol', 'xhigh', 'inherit'),
                           ('reviewer', 'gpt-6.1-sol', 'high', 'inherit')], 'anchored role rows'
          assert "| Helper's work |" in orchestrator, 'orchestrator.md missing helper table'

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          retired = {'.claude-plugin', '.codex-plugin', 'CLAUDE.md'}
          assert not any(retired.intersection(Path(path).parts) for path in tracked), 'retired host artifacts'
          print('Canonical documentation paths, concise role maps, anchored roles, and retired artifacts: OK')
          PY
      - name: No @path references (they force-load context)
        run: |
          ! grep -rn "@[a-zA-Z0-9_-]*/" reference/ --include='*.md' \
            | grep -v "actions/" | grep -v "anthropic" | grep .
      - name: Plugin manifest version verification
        run: python3 -c 'import json; v=json.load(open("plugin.json"))["version"]; assert v; print("plugin.json", v)'

  merged-result:
    name: merged-result / ${{ github.event.pull_request.base.sha }} / ${{ github.event.pull_request.head.sha }}
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "this exact merge of base and head passed the test job"
